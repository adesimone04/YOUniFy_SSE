spring.application.name=YOUniFy

# H2 in-memory DB (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:younify_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.web.pageable.max-page-size=100

# Scheduling
spring.task.scheduling.pool.size=2

# MinIO (disabled startup check for tests)
minio.enabled=false
minio.url=http://localhost:9000
minio.access-key=test-access-key
minio.secret-key=test-secret-key
minio.bucket-name=younify-test-bucket

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Admin
application.security.admin.password=TestAdminPass123!

# JWT (valid Base64 >= 32 bytes for HS256)
application.security.jwt.secret-key=dGVzdC1zZWNyZXQta2V5LWZvci15b3VuaWZ5LXRlc3RzLTEyMzQ1Njc4OTA=
application.security.jwt.expiration=900000
application.security.jwt.refresh-token.expiration=180

# 2FA
application.security.2fa.expiration=300

# Mail (dummy local config)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@younify.it
spring.mail.password=test-mail-pass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# OpenApi PEC (dummy local config)
integration.openapi.base-url=http://localhost:8089
integration.openapi.token=test-openapi-token

# Censorship Service
app.censorship.bad-words=parolaccia,offesa

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Server
server.ssl.enabled=false
