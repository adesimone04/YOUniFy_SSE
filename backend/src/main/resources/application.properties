spring.application.name=YOUniFy

# DB Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
#change in production with false (no log SQL)
spring.jpa.show-sql=true


# Flyway Settings
#spring.flyway.enabled=true
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=1
#spring.flyway.clean-disabled=true


# Admin Setting
application.security.admin.password=${ADMIN_PASS}

# Token (JWT) Settings
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION}
# 2FA Settings
application.security.2fa.expiration=${TWO_FACTOR_EXPIRATION}


# EmailProvider (SMTP) Settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# in production switch with a workspace email (or similar service)
spring.mail.username=younifytester@gmail.com
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OpenApi PEC
integration.openapi.base-url=${OPENAPI_TEST}
integration.openapi.token=${OPENAPI_TOKEN_TEST}

# Censorship Service
app.censorship.bad-words=${CENSORSHIP_WORDS}